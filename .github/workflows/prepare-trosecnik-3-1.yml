name: Prepare Trosecnik 3.1 source

on:
  push:
    branches:
      - survival-expedition-3.1

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand 3.1 Survival Expedition package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="TROSECNIK_3D_3_1_SURVIVAL_EXPEDITION_VERCEL (1).zip"
          test -f "$ZIP"
          TMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP_DIR"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$TMP_DIR"/. ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Trosecnik 3.1 Survival Expedition source"
          git push origin HEAD:survival-expedition-3.1
